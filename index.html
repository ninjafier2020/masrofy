<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصروفي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#12302a;--mute:#5d7a72;--accent:#0f766e;--accent-ink:#fff;--line:#d5e2dc;--warn:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--card:#162621;--ink:#e6f2ee;--mute:#8fb0a6;--accent:#2dd4bf;--accent-ink:#06201b;--line:#27403a;--warn:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0e1a17;--card:#162621;--ink:#e6f2ee;--mute:#8fb0a6;--accent:#2dd4bf;--accent-ink:#06201b;--line:#27403a;--warn:#ff8a7a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,'Noto Sans SC',Arial,sans-serif;font-size:17px;line-height:1.6;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:28px;font-weight:800;margin:8px 0 0}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.date{color:var(--mute);margin:0 0 16px}
.mic-wrap{text-align:center;margin:8px 0 4px}
#mic{width:112px;height:112px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:46px;cursor:pointer;transition:transform .15s,box-shadow .15s}
#mic:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#mic.on{transform:scale(1.08);box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 30%,transparent)}
#status{min-height:72px;margin:10px 0;text-align:center;color:var(--mute)}
#status b{color:var(--ink)}
#status.err{color:var(--warn)}
.lnk{font:inherit;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 12px;margin:0 4px;cursor:pointer}
.manual{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:20px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.add{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.name{flex:1;font-weight:600}
.when{color:var(--mute);font-size:14px}
.amt{font-weight:800;white-space:nowrap}
.del{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:0 4px}
.empty{padding:22px 14px;text-align:center;color:var(--mute)}
.exp{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px;color:var(--mute)}
.exp button,.clear{font:inherit;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer}
.clear{display:block;margin:12px auto 0;color:var(--mute);background:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--accent);color:var(--accent-ink);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:22px}
.bar small{font-weight:600;font-size:15px;opacity:.85}
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="h1">مصروفي</h1>
    <select id="lang" aria-label="Language"><option>العربية</option><option>English</option><option>Русский</option><option>中文</option></select></div>
  <p class="date" id="date"></p>
  <div class="mic-wrap"><button id="mic" aria-label="Mic">🎤</button></div>
  <div id="status"></div>
  <div class="manual">
    <input id="item" aria-label="item">
    <input id="amount" type="number" inputmode="decimal" aria-label="amount">
    <button class="add" id="addBtn"></button>
  </div>
  <ul id="list"></ul>
  <div class="exp"><span id="xl"></span>
    <button data-x="pdf">PDF</button><button data-x="txt">TXT</button><button data-x="doc">Word</button><button data-x="img" id="xi"></button></div>
  <button class="clear" id="clear"></button>
</main>
<div class="bar"><small id="count"></small><span><span id="tl"></span>: <span id="total">0</span><span id="cur"></span></span></div>

<script>
var KEY='masrofy-v3',LG=['ar','en','ru','zh'],RL=['ar-EG','en-US','ru-RU','zh-CN'],DL=['ar-EG','en-US','ru-RU','zh-CN'];
var entries=[],snap=null,pending=false,retried=false,li=0;
try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');li=Math.max(0,LG.indexOf(localStorage.getItem('m3lang')))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var fmt=function(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function say(h,err){var s=$('status');s.className=err?'err':'';s.innerHTML=h}

/* [ar,en,ru,zh] */
var S={
title:['مصروفي','My Expenses','Мои расходы','我的开销'],
hint:['اضغط على المايك وقول: <b>طماطم خمسين وبصل عشرين</b><br>أو: <b>الغي الأخير</b>','Tap the mic and say: <b>tomatoes 50 and onions 20</b><br>or: <b>cancel last</b>','Нажмите на микрофон: <b>помидоры 50 лук 20</b><br>или: <b>отмени последний</b>','点击麦克风说：<b>西红柿50洋葱20</b><br>或：<b>取消最后一个</b>'],
item:['البند','Item','Название','项目'],amt:['المبلغ','Amount','Сумма','金额'],add:['أضف','Add','Добавить','添加'],
total:['الإجمالي','Total','Итого','合计'],cur:[' جنيه','','',''],cnt:['بند','items','поз.','项'],
empty:['لسه مفيش مصروفات. اضغط على المايك وابدأ.','No expenses yet. Tap the mic to start.','Расходов пока нет. Нажмите на микрофон.','还没有记录，点击麦克风开始。'],
clear:['مسح الكل','Clear all','Очистить всё','清空'],listen:['بسمعك...','Listening...','Слушаю...','正在听...'],
saved:['اتسجل: ','Saved: ','Записано: ','已记录：'],gone:['اتلغى: ','Removed: ','Удалено: ','已删除：'],
undo:['تراجع','Undo','Отменить','撤销'],undone:['رجّعت اللي كان.','Restored.','Восстановлено.','已恢复。'],
ask:['تمسح كل البنود؟','Delete all items?','Удалить всё?','删除全部记录？'],yes:['أيوه، امسح','Yes, delete','Да, удалить','是，删除'],no:['لأ','No','Нет','否'],
kept:['تمام، سبت كل حاجة.','OK, nothing deleted.','Хорошо, ничего не удалено.','好的，未删除。'],
none:['مفيش بنود.','Nothing to remove.','Список пуст.','没有记录。'],nf:['مالقيتش بند اسمه ','Not found: ','Не найдено: ','没找到：'],
need:['اكتب البند والمبلغ الأول.','Enter item and amount first.','Введите название и сумму.','请先填写项目和金额。'],
bad:['مقدرتش أفهم، كمّل بإيدك واضغط أضف.','Not understood. Finish by hand and press Add.','Не понял. Допишите вручную.','没听懂，请手动补充后点添加。'],
skip:['مفهمتش: ','Skipped: ','Пропущено: ','已跳过：'],
perm:['اسمح للمتصفح باستخدام المايك.','Allow microphone access in the browser.','Разрешите доступ к микрофону.','请允许使用麦克风。'],
nosp:['مسمعتش حاجة، جرب تاني.','Heard nothing, try again.','Ничего не слышно, повторите.','没听到，请再试。'],
err:['حصلت مشكلة في الصوت.','Voice problem, try again.','Ошибка голоса, повторите.','语音出错，请重试。'],
nosup:['افتح الصفحة بكروم على الأندرويد.','Open this page in Chrome.','Откройте страницу в Chrome.','请用Chrome打开。'],
exp:['تصدير:','Export:','Экспорт:','导出：'],img:['صورة','Image','Картинка','图片']};
var T=function(k){return S[k][li]};

var NM=[
{واحد:1,اتنين:2,اثنين:2,تلاته:3,ثلاثه:3,اربعه:4,خمسه:5,سته:6,سبعه:7,تمانيه:8,ثمانيه:8,تسعه:9,عشره:10,تلات:3,اربع:4,خمس:5,سبع:7,تمان:8,تسع:9,
احداشر:11,اتناشر:12,تلتاشر:13,اربعتاشر:14,خمستاشر:15,ستاشر:16,سبعتاشر:17,تمنتاشر:18,تسعتاشر:19,
عشرين:20,تلاتين:30,ثلاثين:30,اربعين:40,خمسين:50,ستين:60,سبعين:70,تمانين:80,ثمانين:80,تسعين:90,
ميه:100,مايه:100,مئه:100,مائه:100,ميتين:200,مئتين:200,تلتميه:300,ثلاثميه:300,ربعميه:400,خمسميه:500,ستميه:600,سبعميه:700,تمنميه:800,تسعميه:900,
الف:'T',الاف:'T',الفين:2000,نص:0.5,نصف:0.5},
{zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,
twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:'H',thousand:'T',half:0.5},
{один:1,два:2,две:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,десять:10,двадцать:20,тридцать:30,сорок:40,пятьдесят:50,шестьдесят:60,семьдесят:70,восемьдесят:80,девяносто:90,
сто:100,двести:200,триста:300,четыреста:400,пятьсот:500,тысяча:'T',тысячи:'T',тысяч:'T'},null];
var SEP=[['و','ب'],['and','for','at'],['и','по','за'],[]];
var CM=[
{v:['الغي','الغاء','الغ','امسح','مسح','احذف','حذف','شيل'],last:['اخير','اخيره','اخر'],all:['كل','كله'],fill:['بند','حاجه','ده']},
{v:['cancel','delete','remove','undo'],last:['last','latest','previous'],all:['all','everything'],fill:['the','item']},
{v:['отмени','отмена','удали','убери','сотри'],last:['последний','последнее','последнюю'],all:['все','всё'],fill:['пункт']},
{v:['取消','删除','删掉','撤销','清除'],last:['最后','上一个'],all:['所有','全部'],fill:[]}];
var YES=[/(ايوه|ايوا|اه|تمام|اكيد|نعم|امسح)/,/(yes|yeah|yep|ok|sure|confirm)/,/(да|ага|конечно|удали)/,/(是|对|好|确认|嗯)/];

function norm(s){return s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim()}
function bare(w){return w.replace(/^ال/,'')}
function key(s){return li===0?norm(s).split(/\s+/).map(bare).join(' '):s.toLowerCase().trim()}

function numTok(w){
  var d=w.replace(/^[وب](?=\d)/,'').replace(/,(?=\d{3})/g,'').replace(',','.');
  if(/^\d+(\.\d+)?$/.test(d))return {d:parseFloat(d)};
  var m=NM[li],c=li===0?[w,w.replace(/^[وب]/,'')]:[w];
  for(var i=0;i<c.length;i++)if(m.hasOwnProperty(c[i]))return {w:m[c[i]]};
  return null;
}
function parseMulti(text){
  text=text.replace(/[$€₽¥£]/g,' ').trim();
  var raw=text.split(/\s+/),t=(li===0?norm(text):text.toLowerCase()).split(/\s+/).filter(Boolean);
  var out=[],item=[],tot=0,cur=0,has=false,after=false;
  function push(){if(item.length||has)out.push({item:item.join(' '),amount:has?tot+cur:null});item=[];tot=0;cur=0;has=false}
  for(var i=0;i<t.length;i++){
    var w=t[i],n=numTok(w);
    if(n){
      if(n.d!==undefined)tot+=n.d;
      else if(n.w==='T'){tot+=(cur||1)*1000;cur=0}
      else if(n.w==='H')cur=(cur||1)*100;
      else if(n.w>=1000)tot+=n.w;
      else cur+=n.w;
      has=true;continue;
    }
    if(SEP[li].indexOf(w)>=0||(li===0&&/^جنيه/.test(w)))continue;
    if(has){push();after=true}
    var word=(raw[i]||w).replace(/[,.;:!?]+$/,'');
    if(li===0&&after&&!item.length&&word.charAt(0)==='و'&&word.length>2)word=word.slice(1);
    item.push(word);
  }
  push();return out;
}
var ZD={零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function zhNum(s){
  if(/^[\d.]+$/.test(s))return parseFloat(s);
  var t=0,c=0;
  for(var i=0;i<s.length;i++){var h=s.charAt(i);
    if(ZD.hasOwnProperty(h))c=ZD[h];
    else{var m={'十':10,'百':100,'千':1000}[h];if(m){t+=(c||1)*m;c=0}}}
  return t+c;
}
function parseZh(text){
  var s=text.replace(/[块元圆]/g,' ').replace(/[，,、。和跟还有]/g,' '),out=[],m;
  var re=/([^\d.零一二三四五六七八九十百千两\s]+)\s*([\d.零一二三四五六七八九十百千两]+)/g;
  while((m=re.exec(s)))out.push({item:m[1].trim(),amount:zhNum(m[2])});
  return out.length?out:[{item:text,amount:null}];
}
function parse(t){return li===3?parseZh(t):parseMulti(t)}

function command(text){
  var c=CM[li],s=li===0?norm(text):text.toLowerCase().trim(),rest;
  if(li===3){
    var v=c.v.filter(function(x){return s.indexOf(x)===0})[0];
    if(!v)return false;rest=[s.slice(v.length).trim()].filter(Boolean);
  }else{
    var t=s.split(/\s+/).filter(Boolean);
    if(c.v.indexOf(t[0])<0)return false;rest=t.slice(1);
  }
  rest=rest.map(function(w){return li===0?bare(w):w}).filter(function(w){return c.fill.indexOf(w)<0});
  var j=rest.join(' ');
  function has(list){return list.some(function(x){return li===3?j.indexOf(x)>=0:rest.indexOf(x)>=0})}
  if(!entries.length){say(T('none'),true);return true}
  if(has(c.all)){askClear();return true}
  if(!rest.length||has(c.last)){var l=entries[0];act(function(){entries.shift()},T('gone')+'<b>'+esc(l.item)+'</b> '+fmt(l.amount));return true}
  var idx=-1;
  for(var i=0;i<entries.length;i++){var k=key(entries[i].item);if(k&&(k.indexOf(j)>=0||j.indexOf(k)>=0)){idx=i;break}}
  if(idx<0){say(T('nf')+'<b>'+esc(j)+'</b>',true);return true}
  var h=entries[idx];act(function(){entries.splice(idx,1)},T('gone')+'<b>'+esc(h.item)+'</b> '+fmt(h.amount));
  return true;
}
function askClear(){pending=true;retried=false;say(T('ask')+'<br><button class="lnk" id="yes">'+T('yes')+'</button><button class="lnk" id="no">'+T('no')+'</button>',true)}
function doClear(){pending=false;act(function(){entries=[]},T('gone')+'✓')}
function act(fn,msg){snap=JSON.stringify(entries);fn();save();render();say(msg+' <button class="lnk" id="undo">'+T('undo')+'</button>')}
$('status').addEventListener('click',function(ev){
  var id=ev.target.id;
  if(id==='undo'&&snap!==null){entries=JSON.parse(snap);snap=null;save();render();say(T('undone'))}
  else if(id==='yes')doClear();
  else if(id==='no'){pending=false;say(T('kept'))}
});

function render(){
  var ul=$('list');
  if(!entries.length)ul.innerHTML='<li class="empty">'+T('empty')+'</li>';
  else ul.innerHTML=entries.map(function(e,i){
    var d=new Date(e.ts).toLocaleDateString(DL[li],{day:'numeric',month:'short'});
    return '<li><span class="name">'+esc(e.item)+' <span class="when">'+d+'</span></span><span class="amt">'+fmt(e.amount)+'</span><button class="del" data-i="'+i+'" aria-label="x">×</button></li>';
  }).join('');
  $('total').textContent=fmt(entries.reduce(function(a,e){return a+e.amount},0));
  $('count').textContent=entries.length?entries.length+' '+T('cnt'):'';
  $('clear').style.display=entries.length?'block':'none';
}
$('list').addEventListener('click',function(ev){
  var i=ev.target.getAttribute&&ev.target.getAttribute('data-i');
  if(i===null||i===undefined)return;
  var e=entries[+i];act(function(){entries.splice(+i,1)},T('gone')+'<b>'+esc(e.item)+'</b>');
});
$('addBtn').addEventListener('click',function(){
  var item=$('item').value.trim(),a=parseFloat($('amount').value);
  if(!item||isNaN(a)){say(T('need'),true);return}
  act(function(){entries.unshift({item:item,amount:a,ts:Date.now()})},T('saved')+'<b>'+esc(item)+'</b> '+fmt(a));
  $('item').value='';$('amount').value='';
});
$('clear').addEventListener('click',function(){if(entries.length)askClear()});

function handle(text){
  if(pending){if(YES[li].test(li===0?norm(text):text.toLowerCase()))doClear();else{pending=false;say(T('kept'))}return}
  if(command(text))return;
  var items=parse(text),ok=items.filter(function(x){return x.item&&x.amount!==null&&!isNaN(x.amount)}),bad=items.filter(function(x){return ok.indexOf(x)<0&&x.item});
  if(!ok.length){var f=items[0]||{item:text};$('item').value=f.item||text;if(f.amount!=null)$('amount').value=f.amount;say('«'+esc(text)+'»<br>'+T('bad'),true);return}
  var now=Date.now(),msg=ok.map(function(x){return '<b>'+esc(x.item)+'</b> '+fmt(x.amount)}).join(', ');
  act(function(){ok.forEach(function(x,i){entries.unshift({item:x.item,amount:x.amount,ts:now+i})})},T('saved')+msg);
  if(bad.length)$('status').insertAdjacentHTML('beforeend','<br><span style="color:var(--warn)">'+T('skip')+esc(bad.map(function(x){return x.item}).join(', '))+'</span>');
}

/* ---------- Export ---------- */
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
function rows(){return entries.slice().reverse()}
function sum(){return entries.reduce(function(a,e){return a+e.amount},0)}
function stamp(){return new Date().toISOString().slice(0,10)}
function makeCanvas(){
  var r=rows(),W=800,rh=56,H=150+rh*Math.max(r.length,1)+100,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;var c=cv.getContext('2d'),rtl=li===0;
  var F='"Cairo",Tahoma,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif',sx=rtl?W-40:40,ex=rtl?40:W-40,a1=rtl?'right':'left',a2=rtl?'left':'right';
  c.fillStyle='#fff';c.fillRect(0,0,W,H);c.direction=rtl?'rtl':'ltr';
  c.fillStyle='#12302a';c.textAlign=a1;c.font='bold 40px '+F;c.fillText(T('title'),sx,70);
  c.fillStyle='#5d7a72';c.font='22px '+F;c.fillText(new Date().toLocaleDateString(DL[li]),sx,108);
  r.forEach(function(e,i){var y=150+rh*i+36;c.fillStyle='#12302a';c.font='26px '+F;c.textAlign=a1;c.fillText(e.item,sx,y);
    c.textAlign=a2;c.font='bold 26px '+F;c.fillText(fmt(e.amount),ex,y);c.fillStyle='#d5e2dc';c.fillRect(40,y+16,W-80,2)});
  c.fillStyle='#0f766e';c.font='bold 32px '+F;c.textAlign=a1;c.fillText(T('total'),sx,H-40);
  c.textAlign=a2;c.fillText(fmt(sum())+T('cur'),ex,H-40);
  return cv;
}
function pdfFrom(cv){
  var b=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),img=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)img[i]=b.charCodeAt(i);
  var pw=595,ph=Math.round(595*cv.height/cv.width),enc=new TextEncoder(),parts=[],off=[],len=0;
  function add(x){var u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length}
  add('%PDF-1.4\n');
  off[1]=len;add('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  off[2]=len;add('2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n');
  off[3]=len;add('3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+pw+' '+ph+']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n');
  off[4]=len;add('4 0 obj\n<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+img.length+'>>\nstream\n');add(img);add('\nendstream\nendobj\n');
  var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
  off[5]=len;add('5 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream\nendobj\n');
  var x=len;add('xref\n0 6\n0000000000 65535 f \n');
  for(var n=1;n<=5;n++)add(('0000000000'+off[n]).slice(-10)+' 00000 n \n');
  add('trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function doExport(x){
  if(!entries.length){say(T('none'),true);return}
  var n='masrofy-'+stamp();
  if(x==='txt'){
    var L=[T('title')+' - '+stamp(),''];rows().forEach(function(e){L.push(e.item+': '+fmt(e.amount))});
    L.push('','=== '+T('total')+': '+fmt(sum())+T('cur'));
    dl(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/plain;charset=utf-8'}),n+'.txt');
  }else if(x==='doc'){
    var tr=rows().map(function(e){return '<tr><td>'+esc(e.item)+'</td><td>'+fmt(e.amount)+'</td></tr>'}).join('');
    var h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body dir="'+(li===0?'rtl':'ltr')+'"><h2>'+esc(T('title'))+' - '+stamp()+'</h2><table border="1" cellpadding="6" style="border-collapse:collapse">'+tr+'<tr><th>'+T('total')+'</th><th>'+fmt(sum())+esc(T('cur'))+'</th></tr></table></body></html>';
    dl(new Blob(['\ufeff'+h],{type:'application/msword'}),n+'.doc');
  }else if(x==='img'){makeCanvas().toBlob(function(b){dl(b,n+'.png')},'image/png')}
  else if(x==='pdf'){dl(pdfFrom(makeCanvas()),n+'.pdf')}
}
document.querySelector('.exp').addEventListener('click',function(ev){var x=ev.target.getAttribute('data-x');if(x)doExport(x)});

/* ---------- Voice ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,listening=false;
function startRec(){
  rec=new SR();rec.lang=RL[li];rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=function(){listening=true;$('mic').classList.add('on');if(!pending)say(T('listen'))};
  rec.onend=function(){listening=false;$('mic').classList.remove('on');
    if(pending&&!retried){retried=true;setTimeout(function(){if(pending&&!listening)startRec()},300)}};
  rec.onerror=function(e){if(pending)return;say(e.error==='not-allowed'?T('perm'):e.error==='no-speech'?T('nosp'):T('err'),true)};
  rec.onresult=function(e){handle(e.results[0][0].transcript)};
  try{rec.start()}catch(err){}
}
$('mic').addEventListener('click',function(){
  if(!SR){say(T('nosup'),true);return}
  if(listening&&rec){rec.stop();return}
  startRec();
});

function apply(){
  var d=document.documentElement;d.lang=LG[li];d.dir=li===0?'rtl':'ltr';
  document.title=T('title');$('h1').textContent=T('title');
  $('item').placeholder=T('item');$('amount').placeholder=T('amt');$('addBtn').textContent=T('add');$('clear').textContent=T('clear');
  $('tl').textContent=T('total');$('cur').textContent=T('cur');$('xl').textContent=T('exp');$('xi').textContent=T('img');
  $('date').textContent=new Date().toLocaleDateString(DL[li],{weekday:'long',day:'numeric',month:'long'});
  $('lang').selectedIndex=li;pending=false;say(T('hint'));render();
}
$('lang').addEventListener('change',function(){
  li=this.selectedIndex;try{localStorage.setItem('m3lang',LG[li])}catch(e){}
  if(listening&&rec)rec.abort();apply();
});
apply();
</script>
